# ─────────────────────────────────────────────────────────────────────────────
#  idturst.uz → savdoiq.uz
#
#  Asosiy domen savdoiq.uz ga o'tdi. Eski domen yashab qoladi va butun
#  so'rovni (yo'l va so'rov qismi bilan birga) yangisiga yo'naltiradi —
#  ilgari yuborilgan Telegram havolalari ishlashda davom etsin.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name idturst.uz;

    ssl_certificate     /etc/letsencrypt/live/idturst.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/idturst.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://savdoiq.uz$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name idturst.uz;
    return 301 https://savdoiq.uz$request_uri;
}
